[project]
name = "tennis-scoreboard"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ilia Korepanov", email = "ikorepanov.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic==1.18.4",
    "cryptography==48.0.0",
    "pydantic-settings==2.14.1",
    "pymysql==1.1.3",
    "sqlalchemy==2.0.49",
]

[project.scripts]
tennis-scoreboard = "tennis_scoreboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
plugins = ["pydantic.mypy"]
exclude = ["venv", ".venv", "alembic"]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
ignore_missing_imports = true

# for strict mypy:
disallow_untyped_defs = true

[tool.ruff]
exclude = ["alembic"]
line-length = 88

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "I", # isort
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "S", # flake8-bandit
    "PT", # flake8-pytest-style
    "RUF", # Ruff-specific rules
    "ASYNC", # flake8-async
    "PTH", # flake8-use-pathlib
    "D", # pydocstyle
    "ERA", # eradicate
    "YTT", # flake8-2020
    "LOG", # flake8-logging
    "G", # flake8-logging-format
    "ERA", # eradicate
    "FAST", # FastAPI
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "A", # flake8-builtins
    "COM", # flake8-commas
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM", # flake8-errmsg
    "FIX", # flake8-fix-me
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "Q", # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "SLOT", # flake8-slots
    "TID", # flake8-tidy-imports
    "TC", # flake8-type-checking
    "FLY", # flynt
    "C90", # mccabe
    "N", # pep8-naming
    "PERF", # Perflint
    "PL", # Pylint
    "FURB", # refurb
    "TRY", # tryceratops
]
ignore = [
    "E501", # line too long, handled by black,
    "W191", # indentation contains tabs
    "RUF002", # Checks for ambiguous Unicode characters in docstrings.
    "RUF001", # Checks for ambiguous Unicode characters in strings.
    "D203", # incorrect-blank-line-before-class
    "D212", # multi-line-summary-first-line
    "COM812", # missing-trailing-comma
    "Q000", # bad-quotes-inline-string
    "Q003", # bad-quotes-inline-string
    "PLE1205", # logging-too-many-args
    "T20", # flake8-print
    "D", # pydocstyle
]

[tool.ruff.format]
quote-style = "single"

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pre-commit==4.5.1",
    "ruff==0.14.10",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]
"__init__.py" = ["D"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
exclude = [".venv", "**/__pycache__"]